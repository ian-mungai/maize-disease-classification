<g font-family="ui-monospace, Menlo, Consolas, monospace"><text x="40" y="48" font-size="26" fill="#f8fafc" font-weight="700">Maize Disease Classification</text><text x="40" y="80" font-size="15" fill="#94a3b8" >Historical academic prototype · source behavior, not a running deployment</text><rect x="40" y="135" width="1120" height="245" rx="12" fill="#0f172a" fill-opacity="0.25" stroke="#334155" stroke-dasharray="6 6"/><text x="58" y="163" font-size="14" fill="#94a3b8" >TRAINING NOTEBOOK · SEPARATE HISTORICAL EVIDENCE</text><rect x="40" y="430" width="1120" height="420" rx="12" fill="#0f172a" fill-opacity="0.25" stroke="#334155" stroke-dasharray="6 6"/><text x="58" y="458" font-size="14" fill="#94a3b8" >APPLICATION · SHARED IMAGE FILESYSTEM</text><path d="M304 255H376" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M704 255H776" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M248 555H288" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M544 555H584" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M832 555H872" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M704 610V652H560V590H544" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><path d="M416 610V710" fill="none" stroke="#94a3b8" stroke-width="2"  marker-end="url(#flow)"/><g><rect x="80" y="200" width="224" height="110" rx="6" fill="#0f172a"/><rect x="80" y="200" width="224" height="110" rx="6" fill="#94a3b8" fill-opacity="0.07" stroke="#94a3b8" stroke-width="1.5"/><text x="96" y="230" font-size="17" fill="#94a3b8" font-weight="700">Leaf-image folders</text><text x="96" y="257" font-size="14" fill="#cbd5e1" >Training and test</text><text x="96" y="279" font-size="14" fill="#cbd5e1" >Data not redistributed</text></g><g><rect x="376" y="200" width="328" height="110" rx="6" fill="#0f172a"/><rect x="376" y="200" width="328" height="110" rx="6" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.5"/><text x="392" y="230" font-size="17" fill="#34d399" font-weight="700">TensorFlow / Keras notebook</text><text x="392" y="257" font-size="14" fill="#cbd5e1" >CNN training and evaluation</text><text x="392" y="279" font-size="14" fill="#cbd5e1" >Saved outputs; no fresh run</text></g><g><rect x="776" y="200" width="344" height="110" rx="6" fill="#0f172a"/><rect x="776" y="200" width="344" height="110" rx="6" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-width="1.5"/><text x="792" y="230" font-size="17" fill="#a78bfa" font-weight="700">Notebook checkpoint export</text><text x="792" y="257" font-size="14" fill="#cbd5e1" >Model-to-notebook linkage</text><text x="792" y="279" font-size="14" fill="#cbd5e1" >is not established</text></g><g><rect x="80" y="500" width="168" height="110" rx="6" fill="#0f172a"/><rect x="80" y="500" width="168" height="110" rx="6" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-width="1.5"/><text x="96" y="530" font-size="17" fill="#22d3ee" font-weight="700">Browser</text><text x="96" y="557" font-size="14" fill="#cbd5e1" >Upload leaf image</text><text x="96" y="579" font-size="14" fill="#cbd5e1" >Review history</text></g><g><rect x="288" y="500" width="256" height="110" rx="6" fill="#0f172a"/><rect x="288" y="500" width="256" height="110" rx="6" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.5"/><text x="304" y="530" font-size="17" fill="#34d399" font-weight="700">Laravel</text><text x="304" y="557" font-size="14" fill="#cbd5e1" >Save an image file</text><text x="304" y="579" font-size="14" fill="#cbd5e1" >Send its path to Flask</text></g><g><rect x="584" y="500" width="248" height="110" rx="6" fill="#0f172a"/><rect x="584" y="500" width="248" height="110" rx="6" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.5"/><text x="600" y="530" font-size="17" fill="#34d399" font-weight="700">Flask</text><text x="600" y="557" font-size="14" fill="#cbd5e1" >Read image path</text><text x="600" y="579" font-size="14" fill="#cbd5e1" >Return one class</text></g><g><rect x="872" y="500" width="248" height="110" rx="6" fill="#0f172a"/><rect x="872" y="500" width="248" height="110" rx="6" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-width="1.5"/><text x="888" y="530" font-size="17" fill="#a78bfa" font-weight="700">Bundled SavedModel</text><text x="888" y="557" font-size="14" fill="#cbd5e1" >Loaded per request</text><text x="888" y="579" font-size="14" fill="#cbd5e1" >Historical artifact</text></g><g><rect x="288" y="710" width="544" height="110" rx="6" fill="#0f172a"/><rect x="288" y="710" width="544" height="110" rx="6" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-width="1.5"/><text x="304" y="740" font-size="17" fill="#a78bfa" font-weight="700">MySQL</text><text x="304" y="767" font-size="14" fill="#cbd5e1" >Users, predictions and image references</text><text x="304" y="789" font-size="14" fill="#cbd5e1" >Editable disease-to-pesticide recommendations</text></g><text x="740" y="674" font-size="13" fill="#cbd5e1" >Class returned to Laravel</text><text x="80" y="915" font-size="14" fill="#94a3b8" >No account records, user uploads or database dump are published.</text>
