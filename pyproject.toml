[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "T20"]

[[tool.mypy.overrides]]
# TensorFlow ships no type information; the service treats the loaded model as Any.
module = ["tensorflow", "tensorflow.*"]
ignore_missing_imports = true
